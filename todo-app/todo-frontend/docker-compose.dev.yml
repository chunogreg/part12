services:
  app:
    image: todo-frontend
    build:
      context: .
      # dockerfile: dev.Dockerfile
    volumes:
      - ./:/usr/src/app
      # - node_modules:/usr/src/app/node_modules
    ports:
      - 1032:5173
    container_name: todo-frontend
    command: npm run dev -- --host 0.0.0.0
  debug-helper:
    image: busybox
